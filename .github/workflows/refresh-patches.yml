# Keeps the patch corpus current.
#
# It went eleven months stale once already, and the bot answered confidently
# from year-old notes the whole time, so this runs on a schedule rather than
# whenever someone remembers.
name: Refresh patch notes

on:
  schedule:
    # Tuesdays 14:00 UTC. VALORANT patches land roughly fortnightly, midweek.
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-patches
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Lifted to job level so a step can test whether it was ever configured.
      # Evals are skipped rather than failed when the secret is absent.
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape patch notes
        run: python scrape.py

      - name: Report what changed
        id: diff
        run: |
          if git diff --quiet -- feedme_patchnotes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new patch notes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python summarize_refresh.py
          fi

      # Only worth verifying when there is something new to verify, and only
      # possible when a key is available.
      - name: Check retrieval still works
        if: steps.diff.outputs.changed == 'true' && env.MISTRAL_API_KEY != ''
        run: python evals/run.py

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedme_patchnotes.json valorant_patch_notes_checkpoint.jsonl
          git commit -m "Refresh patch notes from the scheduled scrape"
          git push
