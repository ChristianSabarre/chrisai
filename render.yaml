services:
  - type: web
    name: chrisai
    runtime: python
    plan: free
    # Embeddings are computed here rather than on first request. Build output
    # survives the idle spin-down that wipes nothing else, so the service comes
    # back up without re-embedding the corpus or spending API calls.
    buildCommand: pip install -r requirements.txt && python build_index.py
    # Single worker: the vector index is built in memory at startup, so each
    # extra worker would re-embed the whole corpus. Extended timeout covers
    # the embedding pass during boot.
    # Threads rather than workers: streaming replies hold a connection open for
    # their whole duration, and every extra worker would rebuild the in-memory
    # index. Extended timeout covers the embedding pass during boot.
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
